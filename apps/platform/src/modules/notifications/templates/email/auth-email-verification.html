<div style="background-color:#f5f7fb;padding:32px;font-family:Arial,sans-serif;color:#10243a;">
  <div style="max-width:560px;margin:auto;background-color:#ffffff;padding:32px;border-radius:16px;">
    <p style="font-weight:bold;">{{platformName}}</p>
    <h1>Verify your email</h1>
    <p>Hello {{recipientName}},</p>
    <p>Confirm your email address to continue with your SME Fund account.</p>
    <p><a href="{{actionUrl}}" style="background-color:#10243a;color:#ffffff;padding:12px 20px;display:inline-block;border-radius:8px;">Verify email</a></p>

  </div>
</div>
