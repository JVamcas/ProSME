name: Continuous integration

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: smefund
          POSTGRES_USER: smefund
          POSTGRES_PASSWORD: smefund-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smefund -d smefund"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://smefund:smefund-ci@127.0.0.1:5432/smefund
      PAYLOAD_SECRET: ci-placeholder-secret-with-at-least-32-characters
      FIREBASE_PROJECT_ID: ci-placeholder
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
      NEXT_PUBLIC_FIREBASE_APP_ID: ci-placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm
      - run: npm ci
      - run: npm run db:migrate --workspace @prosme/platform
      - run: npm run payload --workspace @prosme/platform -- migrate
      - run: npm run check
