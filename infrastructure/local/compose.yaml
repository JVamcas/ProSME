services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smefund
      POSTGRES_USER: smefund
      POSTGRES_PASSWORD: smefund-local-only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smefund -d smefund"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - smefund-postgres:/var/lib/postgresql/data

volumes:
  smefund-postgres:
