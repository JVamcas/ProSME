name: smefund-${ENVIRONMENT:-local}

services:
  db:
    image: postgres:16-alpine
    container_name: smefund-${ENVIRONMENT:-local}-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smefund}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smefund-local-only}
      POSTGRES_USER: ${POSTGRES_USER:-smefund}
    expose:
      - "5432"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready
          -h 127.0.0.1
          -p 5432
          -U "$${POSTGRES_USER}"
          -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - platform

  migrations:
    container_name: smefund-${ENVIRONMENT:-local}-migrations
    build:
      context: ../..
      dockerfile: apps/platform/Dockerfile
      target: migrations
    restart: "no"
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    volumes:
      - payload-media:/workspace/apps/platform/media
    networks:
      - platform

  app:
    container_name: smefund-${ENVIRONMENT:-local}-app
    build:
      context: ../..
      dockerfile: apps/platform/Dockerfile
      target: runtime
    restart: unless-stopped
    init: true
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: production
      PORT: "3008"
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-adc.json
      GCS_DOCUMENTS_BUCKET: smepro
      GOOGLE_CLOUD_PROJECT: msmepro
    ports:
      - "${APPLICATION_BIND_ADDRESS:-0.0.0.0}:${APPLICATION_PORT:-3008}:3008"
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - /workspace/scripts/container/healthcheck.sh
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      - payload-media:/workspace/apps/platform/media
      - ~/.config/gcloud/application_default_credentials.json:/run/secrets/gcp-adc.json:ro
    networks:
      - platform

volumes:
  postgres-data:
  payload-media:

networks:
  platform:
    driver: bridge
