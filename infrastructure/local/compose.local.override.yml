services:
  db:
    image: postgres:16-alpine
    container_name: smefund-${ENVIRONMENT:-local}-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smefund}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smefund-local-only}
      POSTGRES_USER: ${POSTGRES_USER:-smefund}
    expose:
      - "5432"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready
          -h 127.0.0.1
          -p 5432
          -U "$${POSTGRES_USER}"
          -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - platform

  migrations:
    depends_on:
      db:
        condition: service_healthy

  app:
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-adc.json
    volumes:
      - ${HOME}/.config/gcloud/application_default_credentials.json:/run/secrets/gcp-adc.json:ro

volumes:
  postgres-data:
