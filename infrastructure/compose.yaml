name: smefund-${ENVIRONMENT:-local}

services:
  migrations:
    container_name: smefund-${ENVIRONMENT:-local}-migrations
    build:
      context: ..
      dockerfile: apps/platform/Dockerfile
      target: migrations
    restart: "no"
    env_file:
      - ../.env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      GCS_DOCUMENTS_BUCKET: ${GCS_DOCUMENTS_BUCKET:-smepro}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-msmepro}
      GCS_ROOT_PREFIX: ${GCS_ROOT_PREFIX:?GCS_ROOT_PREFIX must be set to dev or prod}
      NODE_ENV: production
    security_opt:
      - no-new-privileges:true
    volumes:
      - payload-media:/workspace/apps/platform/media
    networks:
      - platform

  app:
    container_name: smefund-${ENVIRONMENT:-local}-app
    image: smefund-${ENVIRONMENT:-local}-platform
    build:
      context: ..
      dockerfile: apps/platform/Dockerfile
      target: runtime
      args:
        GCS_ROOT_PREFIX: ${GCS_ROOT_PREFIX:?GCS_ROOT_PREFIX must be set to dev or prod}
    restart: unless-stopped
    init: true
    env_file:
      - ../.env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      GCS_ROOT_PREFIX: ${GCS_ROOT_PREFIX:?GCS_ROOT_PREFIX must be set to dev or prod}
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: production
      PORT: "3008"
      GCS_DOCUMENTS_BUCKET: smepro
      GOOGLE_CLOUD_PROJECT: msmepro
    ports:
      - "${APPLICATION_BIND_ADDRESS:-0.0.0.0}:${APPLICATION_PORT:-3008}:3008"
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - /workspace/scripts/container/healthcheck.sh
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      - payload-media:/workspace/apps/platform/media
    networks:
      - platform

  notification-scheduler:
    container_name: smefund-${ENVIRONMENT:-local}-notification-scheduler
    image: smefund-${ENVIRONMENT:-local}-platform
    command:
      - node
      - /workspace/scripts/container/notification-scheduler.mjs
    restart: unless-stopped
    init: true
    environment:
      NOTIFICATION_PROCESSOR_INTERVAL_MS: ${NOTIFICATION_PROCESSOR_INTERVAL_MS:-60000}
      NOTIFICATION_PROCESSOR_SECRET: ${NOTIFICATION_PROCESSOR_SECRET}
      NOTIFICATION_PROCESSOR_URL: http://app:3008/api/internal/notifications/process
      NOTIFICATION_SCHEDULER_MAX_CONSECUTIVE_FAILURES: ${NOTIFICATION_SCHEDULER_MAX_CONSECUTIVE_FAILURES:-5}
      NOTIFICATION_SCHEDULER_REQUEST_TIMEOUT_MS: ${NOTIFICATION_SCHEDULER_REQUEST_TIMEOUT_MS:-60000}
    depends_on:
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - node
        - /workspace/scripts/container/notification-scheduler-healthcheck.mjs
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - platform

volumes:
  payload-media:

networks:
  platform:
    driver: bridge
